{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <a href="{{ url_for('list_stories') }}" class="outline-button mb-3">&larr;&nbsp; Back to All Stories</a>
        {% if story.image_filename %}
            <img src="{{ url_for('static', filename='uploads/' + story.image_filename) }}" class="img-fluid rounded my-4" alt="{{ story.title }}" loading="lazy">
        {% endif %}
        <h1 class="display-4 my-4">{{ story.title }}</h1>
        <p class="text-muted border-bottom pb-3 mb-4">By {{ story.author or 'Docathon Staff' }}</p>
        <div>
            {{ story.content|replace('\n', '<br>')|safe }}
        </div>
    </div>
</div>
{% endblock %}
