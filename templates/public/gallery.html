{% extends "base.html" %}

{% block content %}

<style>
.gallery-page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 25px 80px;
}

.gallery-header {
    margin-bottom: 45px;
}

.gallery-eyebrow {
    color: var(--gold);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.gallery-header h1 {
    margin: 0;
    font-size: clamp(2rem, 1.1rem + 4.5vw, 4.375rem);
    line-height: 1;
    letter-spacing: 0;
    font-weight: 900;
}

.gallery-header h1 span {
    color: var(--gold);
}

.gallery-header p {
    max-width: 650px;
    margin-top: 18px;
    opacity: .6;
    font-size: 16px;
}

.gallery-event {
    margin-bottom: 55px;
}

.gallery-event-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.gallery-event-title h2 {
    margin: 0;
    font-size: 25px;
    font-weight: 850;
}

.gallery-event-title span {
    color: var(--gold);
    font-size: 12px;
    font-weight: 700;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.gallery-card {
    height: 240px;
    overflow: hidden;
    border-radius: 17px;
    border: 1px solid rgba(201,162,39,.22);
    background: #151515;
}

.gallery-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .35s ease;
}

.gallery-card:hover img {
    transform: scale(1.05);
}

.gallery-empty {
    padding: 45px 20px;
    text-align: center;
    border: 1px dashed rgba(201,162,39,.3);
    border-radius: 17px;
    opacity: .6;
}

@media (max-width: 800px) {
    .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 520px) {
    .gallery-grid {
        grid-template-columns: 1fr;
    }

    .gallery-card {
        height: 250px;
    }
}
</style>

<div class="gallery-page reveal">

    <div class="gallery-header">
        <div class="gallery-eyebrow">
            ✦ DOCATHON GALLERY
        </div>

        <h1>
            Moments from <span>Docathon.</span>
        </h1>

        <p>
            Explore photographs and memories from the events,
            matches and activities organised by the Department of Commerce.
        </p>
    </div>


    <!-- EVENT 1 -->

    <section class="gallery-event">

        <div class="gallery-event-title">
            <h2>Docathon</h2>
            <span>EVENT GALLERY</span>
        </div>

        <div class="gallery-grid">

            <!-- Add your images here -->

            <div class="gallery-empty">
                📸<br>
                Photos coming soon
            </div>

        </div>

    </section>

</div>

{% endblock %}
